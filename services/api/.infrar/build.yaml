# infrar: build-spec rules 2
schema_version: 1
dockerfile: Dockerfile
env:
  - name: PORT
    default: "8083"
  - name: DATABASE_URL
    from: orbit
  - name: MAIL_API_KEY
    secret: true
  - name: MAIL_FROM
    default: "orbit@mail.infrar.io"
run:
  api_prefix: /api
requires:
  db:
    product: postgres
