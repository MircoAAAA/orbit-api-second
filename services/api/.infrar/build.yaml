# infrar: build-spec rules 2
schema_version: 1
dockerfile: Dockerfile
env:
  - name: PORT
    default: "8083"
  - name: MAIL_API_KEY
    secret: true
  - name: MAIL_FROM
    default: "orbit@mail.infrar.io"
run:
  api_prefix: /api
requires:
  orbit:
    product: postgres
    version: "16"
    tenancy: database
    env:
      DATABASE_URL: url
